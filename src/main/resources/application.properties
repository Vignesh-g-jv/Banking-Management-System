spring.application.name=banking-management
server.port=8080

# Default database: file-based H2 (data survives restarts, stored in ./data).
# Switch to MySQL with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/bankdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Browse the tables at http://localhost:8080/h2-console (JDBC URL above, user sa, empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Business rule: largest single deposit, withdrawal or transfer
bank.max-transaction-amount=1000000
