# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Credentials come from environment variables so they never live in the repository.
spring.datasource.url=jdbc:mysql://localhost:3306/bankdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
